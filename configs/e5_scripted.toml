model = "scripted-no-model"
num_tasks = 1
num_rollouts = 1
max_concurrent = 1
push = false
output_dir = "outputs/p2c-cli"

[client]
type = "eval"
base_url = "http://127.0.0.1:9/v1"
api_key_var = "QI_DISABLED_MODEL_API"

[env.taskset]
id = "qi-cost-realism"
first_seed = 1004000
count = 1

[env.agent.runtime]
type = "docker"
allow = []
