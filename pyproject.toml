[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "quant-integrity-envs"
version = "0.0.1"
description = "Verifiable-reward environments for quantitative research integrity"
requires-python = ">=3.11,<3.15"
dependencies = [
  "PyYAML==6.0.3",
  "verifiers==0.3.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/qi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra -q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
