name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install uv==0.13.4
      - run: uv sync --locked --group dev
      - name: Prepare E1 real runtime
        run: |
          sudo mkdir -p /home/kartik
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /home/kartik/qi-sandbox /home/kartik/qi-private
          docker build -t qi-e1-p2b:local envs/e1_pit_backtest/container
      - run: uv run pytest
        env:
          QI_REAL_SANDBOX: "1"
      - name: Reject tracked files over 1 MiB
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          oversized = [(name, Path(name).stat().st_size) for name in files if Path(name).is_file() and Path(name).stat().st_size > 1024 * 1024]
          if oversized:
              raise SystemExit(f"tracked files exceed 1 MiB: {oversized}")
          PY
